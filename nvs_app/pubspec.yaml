name: nvs_app
description: Network Vulnerability Scanner App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  pdf: ^3.10.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  path_provider: ^2.1.3
  open_file: ^3.5.10
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# App Icon Generator
  flutter_launcher_icons: ^0.14.4

# Icon generation config
flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  macos:
    generate: true
  linux: true
  image_path: "assets/NVS_icon/NVS.png"

flutter:
  uses-material-design: true

  assets:

     
